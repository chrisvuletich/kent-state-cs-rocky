server {
    listen 80;
    listen [::]:80;
    server_name rocky.cs.kent.edu;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rocky.cs.kent.edu;

    ssl_certificate /etc/letsencrypt/live/rocky.cs.kent.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rocky.cs.kent.edu/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20';
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;

    location ~ /\.(?!well-known) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
    }

    error_log /var/log/nginx/rocky.cs.kent.edu_error.log warn;
    access_log /var/log/nginx/rocky.cs.kent.edu_access.log;
}
