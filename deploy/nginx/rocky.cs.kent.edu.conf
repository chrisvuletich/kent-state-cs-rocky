## Coarse public-ingress protection. Application-level limits still apply per
## API key; this shared-IP limit bounds unauthenticated database/audit traffic.
limit_req_zone $binary_remote_addr zone=rocky_public_api_per_ip:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name rocky.cs.kent.edu;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rocky.cs.kent.edu;

    ssl_certificate /etc/letsencrypt/live/rocky.cs.kent.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rocky.cs.kent.edu/privkey.pem;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE+AESGCM:ECDHE+CHACHA20:DHE+AESGCM:DHE+CHACHA20';
    ssl_prefer_server_ciphers on;

    client_max_body_size 10m;
    error_page 413 = @rocky_ingress_request_too_large;
    error_page 429 = @rocky_ingress_rate_limited;

    location ~ /\.(?!well-known) {
        return 404;
    }

    location = /v1/responses {
        # Rocky's disabled-by-default application limit starts at 256 KiB. This
        # outer ceiling permits the documented 6 MiB image budget when enabled.
        client_max_body_size 10m;
        limit_req zone=rocky_public_api_per_ip burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Rocky-Internal-Secret "";
        proxy_set_header X-Rocky-User-Id "";
        proxy_set_header X-Rocky-User-Email "";
        proxy_set_header X-Rocky-User-Name "";
        proxy_set_header X-Rocky-User-Is-Admin "";
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location = /v1/models {
        limit_req zone=rocky_public_api_per_ip burst=120 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Rocky-Internal-Secret "";
        proxy_set_header X-Rocky-User-Id "";
        proxy_set_header X-Rocky-User-Email "";
        proxy_set_header X-Rocky-User-Name "";
        proxy_set_header X-Rocky-User-Is-Admin "";
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location @rocky_ingress_rate_limited {
        default_type application/json;
        add_header Retry-After "1" always;
        return 429 '{"error":{"message":"Too many requests reached Rocky from this network address. Retry shortly.","type":"rate_limit_error","param":null,"code":"ingress_rate_limit_exceeded"}}';
    }

    location @rocky_ingress_request_too_large {
        default_type application/json;
        return 413 '{"error":{"message":"Request body is too large.","type":"invalid_request_error","param":null,"code":"request_too_large"}}';
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    error_log /var/log/nginx/rocky.cs.kent.edu_error.log warn;
    access_log /var/log/nginx/rocky.cs.kent.edu_access.log;
}
