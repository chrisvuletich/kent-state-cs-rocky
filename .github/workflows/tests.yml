name: Rocky Test Suite

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r rocky-backend/requirements.txt -r run-test/requirements-compat.txt

      - name: Seed backend from backend fixtures
        run: python rocky-backend/seed_from_backend.py

      - name: Run backend tests
        env:
          PYTHONPATH: rocky-backend
        run: |
          set -o pipefail
          mkdir -p run-test/logs
          python -m unittest discover -s run-test/backend -p "test_*.py" -v 2>&1 | tee run-test/logs/backend-tests.log

      - name: Upload backend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-log
          path: run-test/logs/backend-tests.log

  frontend-tests:
    runs-on: ubuntu-latest
    env:
      ROCKY_ENABLE_STREAMING: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rocky-interface/package-lock.json

      - name: Install frontend dependencies
        working-directory: rocky-interface
        run: npm ci

      - name: Run frontend unit tests
        working-directory: rocky-interface
        run: npm run test:unit

      - name: Check frontend formatting
        working-directory: rocky-interface
        run: npm run lint

      - name: Run frontend type checks
        working-directory: rocky-interface
        env:
          PUBLIC_APP_ENV: testing
          PUBLIC_API_BASE_URL: http://127.0.0.1:5001
          PUBLIC_ENABLE_DBTEST: "false"
          PUBLIC_ENABLE_MICROSOFT_OAUTH: "false"
        run: npm run check

      - name: Build frontend
        working-directory: rocky-interface
        env:
          PUBLIC_APP_ENV: testing
          PUBLIC_API_BASE_URL: http://127.0.0.1:5001
          PUBLIC_ENABLE_DBTEST: "false"
          PUBLIC_ENABLE_MICROSOFT_OAUTH: "false"
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install browser test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium
          pip install -r rocky-backend/requirements.txt

      - name: Run frontend browser tests
        env:
          PYTHONPATH: run-test:rocky-backend
          PUBLIC_APP_ENV: testing
          PUBLIC_API_BASE_URL: http://127.0.0.1:5001
          PUBLIC_ENABLE_DBTEST: "false"
          PUBLIC_ENABLE_MICROSOFT_OAUTH: "false"
          ROCKY_WEB_HOST: 127.0.0.1
          ROCKY_WEB_PORT: "4173"
          ROCKY_ALLOWED_HOSTS: 127.0.0.1,localhost
        run: |
          set -o pipefail
          mkdir -p run-test/logs
          python -m unittest discover -s run-test/frontend -p "test_*.py" -v 2>&1 | tee run-test/logs/frontend-tests.log

      - name: Upload frontend test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-log
          path: run-test/logs/frontend-tests.log

  granite-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Granite bridge dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r granite-llm-server/requirements.txt

      - name: Run Granite bridge tests
        working-directory: granite-llm-server
        run: python -m unittest discover -s tests -p "test_*.py" -v
